name: Compila APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # chiave di firma privata, salvata solo nei Secrets del repository
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Controlla la chiave di firma
        if: env.KEYSTORE_B64 == '' || env.KEYSTORE_PASSWORD == ''
        run: |
          echo "::error::Mancano i Secrets KEYSTORE_B64 e/o KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
          exit 1

      - name: Chiave di firma dai Secrets
        run: |
          mkdir -p signing
          # tollera spazi e a capo entrati nella copia da telefono
          printf %s "$KEYSTORE_B64" | tr -d ' \r\n\t' | base64 -d > signing/app.keystore 2>/dev/null || {
            echo "::error::KEYSTORE_B64 non è valido: ricopia l'intera riga lunga del file, senza parole in più."; exit 1; }
          keytool -list -keystore signing/app.keystore -storepass "$KEYSTORE_PASSWORD" -alias notespese > /dev/null 2>&1 || {
            echo "::error::La chiave c'è ma KEYSTORE_PASSWORD non corrisponde (oppure KEYSTORE_B64 è incompleto)."; exit 1; }
          echo "Chiave di firma OK"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compila
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NoteSpeseTrasferta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NoteSpeseTrasferta-apk
          path: NoteSpeseTrasferta.apk

      - name: Pubblica come release scaricabile
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Note spese trasferta 1.0.${{ github.run_number }}
          files: NoteSpeseTrasferta.apk
          make_latest: true
