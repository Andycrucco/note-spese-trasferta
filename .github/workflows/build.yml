name: Compila APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # unica password, salvata nei Secrets: apre la chiave cifrata signing/app.keystore.enc
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Apri la chiave di firma
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Manca il Secret KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."; exit 1; fi
          KEYSTORE_PASSWORD="$(printf %s "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/app.keystore.enc -out signing/app.keystore -pass env:KEYSTORE_PASSWORD 2>/dev/null || {
            echo "::error::KEYSTORE_PASSWORD non apre la chiave: ricopia la password di 32 caratteri."; exit 1; }
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "Chiave di firma OK"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compila (APK da installare e AAB per Play Store)
        run: gradle :app:assembleCompletaDebug :app:assembleSenzaSmsDebug :app:bundleCompletaRelease --no-daemon --stacktrace

      - name: Rinomina APK
        run: |
          cp app/build/outputs/apk/completa/debug/app-completa-debug.apk NoteSpeseTrasferta.apk
          cp app/build/outputs/apk/senzaSms/debug/app-senzaSms-debug.apk NoteSpeseTrasferta-senzaSMS.apk
          cp app/build/outputs/bundle/completaRelease/app-completa-release.aab NoteSpeseTrasferta-PlayStore.aab

      - uses: actions/upload-artifact@v4
        with:
          name: NoteSpeseTrasferta-apk
          path: |
            NoteSpeseTrasferta.apk
            NoteSpeseTrasferta-senzaSMS.apk
            NoteSpeseTrasferta-PlayStore.aab

      - name: Pubblica come release scaricabile
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Note spese trasferta 1.0.${{ github.run_number }}
          files: |
            NoteSpeseTrasferta.apk
            NoteSpeseTrasferta-senzaSMS.apk
            NoteSpeseTrasferta-PlayStore.aab
          make_latest: true
