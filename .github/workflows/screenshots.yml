name: Screenshot Play Store

# Avvio manuale (Actions > Screenshot Play Store > Run workflow): compila l'app, la apre su un emulatore Android
# con spese di prova inventate e salva le schermate da caricare su Google Play (artifact "screenshot-play").
on:
  workflow_dispatch: {}

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compila la versione per Play (senza lettura SMS)
        run: gradle :app:assembleSenzaSmsDebug --no-daemon

      - name: Abilita KVM per l'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulatore e screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 playstore/screenshots.py app/build/outputs/apk/senzaSms/debug/app-senzaSms-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-play
          path: playstore/out
